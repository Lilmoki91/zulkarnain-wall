<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Tembok Zulkarnain</title>
    <style>
        body {
            background: #0a0a0a;
            color: #c0c0c0;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            color: #d4a853;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧱⚛️🛡️</h1>
        <h2>Tembok Zulkarnain</h2>
        <p>Sila log masuk untuk membuka kunci.</p>
        
        <!-- Telegram Login Widget -->
        <script async 
            src="https://telegram.org/js/telegram-widget.js?22" 
            data-telegram-login="azura_ai_webbot" 
            data-size="large" 
            data-onauth="onTelegramAuth(user)" 
            data-request-access="write">
        </script>
    </div>

    <script>
        // Token rahsia untuk membuka Tembok Zulkarnain
        const SECRET_TOKEN = 'tembok_zulkarnain_2026';

        // Fungsi yang dipanggil selepas log masuk Telegram berjaya
        function onTelegramAuth(user) {
            // Tetapkan kuki dengan token rahsia
            document.cookie = `zulkarnain_stasis_token=${SECRET_TOKEN}; path=/; max-age=86400; Secure; SameSite=Strict`;
            
            // Bawa pengguna ke halaman utama Tembok Zulkarnain
            window.location.href = 'https://zulkarnain-wall.pages.dev/';
        }
    </script>
</body>
</html>
